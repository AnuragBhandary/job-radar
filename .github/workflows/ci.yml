name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # No test in this project contacts a live ATS endpoint, so CI needs no
      # network access beyond dependency resolution and no secrets at all.
      - name: Build and test
        run: mvn -B --no-transfer-progress verify
