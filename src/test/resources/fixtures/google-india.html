<!doctype html><html><body><script nonce="x">AF_initDataCallback({key: 'ds:1', hash: '2', data:[[["122710813273137862", "Software Engineer, Search", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckTDyG8KvNTfMuF9XmDArpGxJwhN7rPkCX2B-I9ZuzTq7EjsA1Ny_ixScHbQHXu3HCG6jtlwi9_gz1sps_tnu9HYeMbN6OWMQVgIwB95C8PBsI329JbznARSYeW41CA%3D%3D_V2&loc=IN&title=Software+Engineer", [null, "<ul>\n<li>Write product or system development code.</li>\n<li>Review code developed by other developers and provide feedback to ensure best practices (e.g., style guidelines, checking code in, accuracy, testability, and efficiency).</li>\n<li>Contribute to existing documentation or educational content and adapt content based on product/program updates and user feedback.</li>\n<li>Triage product or system issues and debug/track/resolve by analyzing the sources of issues and the impact on hardware, network, or service operations and quality.</li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor’s degree or equivalent practical experience.</li>\n<li>1 year of experience with software development in one or more programming languages (e.g., Python, C, C++, Java, JavaScript).</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Master's degree or PhD in Computer Science or related technical field.</li>\n<li>Experience developing accessible technologies.</li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Bengaluru, Karnataka, India", ["3, Old Madras Rd, Sadanandanagar, Bennigana Halli, Bengaluru, Karnataka 560038, India"], "Bengaluru", "560038", "KA", "IN"]], [null, "<p>Google's software engineers develop the next-generation technologies that change how billions of users connect, explore, and interact with information and one another. Our products need to handle information at massive scale, and extend well beyond web search. We're looking for engineers who bring fresh ideas from all areas, including information retrieval, distributed computing, large-scale system design, networking and data storage, security, artificial intelligence, natural language processing, UI design and mobile; the list goes on and is growing every day. As a software engineer, you will work on a specific project critical to Google’s needs with opportunities to switch teams and projects as you and our fast-paced business grow and evolve. We need our engineers to be versatile, display leadership qualities and be enthusiastic to take on new problems across the full-stack as we continue to push technology forward.</p>\n<p>With your technical expertise you will manage project priorities, deadlines, and deliverables. You will design, develop, test, deploy, maintain, and enhance software solutions.</p><p>In Google Search, we're reimagining what it means to search for information – any way and anywhere. To do that, we need to solve complex engineering challenges and expand our infrastructure, while maintaining a universally accessible and useful experience that people around the world rely on. In joining the Search team, you'll have an opportunity to make an impact on billions of people globally.<b></b></p>"], [4, 3, 2], [1788883642, 320000000], [1788883642, 320000000], [1788883642, 411000000], [null, "In most instances, this position requires in-person interviews as part of the hiring process."], null, null, [null, ""], [null, "<ul>\n<li>Bachelor’s degree or equivalent practical experience.</li>\n<li>1 year of experience with software development in one or more programming languages (e.g., Python, C, C++, Java, JavaScript).</li>\n</ul>"], 1], ["98831936494936774", "Account Strategist, Google Customer Solutions", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckaHD4KUX_7RZUM-Ow1tboXXbch1u0DpIbKxnqSs8jtJdEjsA9yzvgoJ851X3FF4B2MnDbZwylOuC8xf6HLVTL887eouP46gyVrOw1VXPEqmpdYTByPAkyIDjqhNg-A%3D%3D_V2&loc=IN&title=Account+Strategist", [null, "<ul>\n<li>Manage a portfolio of customers alongside account managers to deliver against goals, while prioritizing and delivering a quality sales experience to customers.</li>\n<li>Establish credibility with executives and serve as a trusted consultant to optimize and expand their advertising investment by understanding business drivers, identifying opportunities for growth, managing risks and creating multi-quarter plans for sustainable business growth.</li>\n<li>Drive business growth, partnerships, business planning and strategy, review, and education for customers.</li>\n<li>Coach peers in the organization to create skill lift that drives customer growth and contributes to team success.</li>\n<li>Collaborate with cross-functional teams to enable customer growth.</li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li> Bachelor's degree or equivalent practical experience.</li>\n<li> 2 years of experience with stakeholder management, business, sales industry or customer engagement.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Knowledge of the local market with excellent investigative skills.</li>\n<li>Knowledge of traditional and online marketing strategy and tactics, and products across all digital advertising.</li>\n<li>Ability to lead and manage multiple projects with internal and external stakeholders.</li>\n<li>Ability to think about issues and develop recommendations and action plans.</li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Gurugram, Haryana, India", ["691, Jaipur - Delhi Expy, Silokhera, Sector 15 Part 2, Sector 15, Gurugram, Haryana 122001, India"], "Gurugram", "122001", "HR", "IN"], ["Bengaluru, Karnataka, India", ["Bengaluru, Karnataka, India"], "Bengaluru", null, "KA", "IN"], ["Mumbai, Maharashtra, India", ["Mumbai, Maharashtra, India"], "Mumbai", null, "MH", "IN"]], [null, "<p>Businesses of all shapes and sizes rely on Google’s unparalleled advertising solutions to help them grow in today's dynamic marketing environment. You bring a passion for sales, knowledge of online media, and commitment to maximize customer success. You act like an owner, move with velocity through change, finding innovative and strategic ways to consistently deliver extraordinary and incremental outcomes for both Google and your customers. You build trusted relationships with customers, uncovering their business needs and translating them into powerful solutions to achieve their most ambitious goals. You achieve as a team with sellers, shape the future of advertising in the AI-era, and make a real impact on the millions of companies and billions of users that trust Google with their most important goals.</p>\n<p>In this role, you will work with the advertisers to shape their business growth and strengthen relationships. You will drive product adoption and business growth. You will anticipate how decisions are made at C-Level and you will explore and uncover the business needs of customers, and understand how the range of product offerings can grow their business. You will set the goal and strategy for how their advertising can reach users.</p><p>Google Customer Solutions (GCS) sales teams are trusted advisors and competitive sellers who maintain a relentless focus on customer success by bringing the best Google has to offer to small- and medium-sized businesses (SMBs), which are the backbone of our communities. As a member of our team, you’ll have the opportunity to work with company owners and make a real difference in their businesses by helping them grow.  Together, we help shape the future of innovation for customers, partners, and sellers...and we have fun doing it.</p>"], [2], [1790772125, 556000000], [1790772125, 556000000], [1790772125, 825000000], [null, ""], null, null, [null, "Note: By applying to this position you will have an opportunity to share your preferred working location from the following: <b>Gurugram, Haryana, India; Bengaluru, Karnataka, India; Mumbai, Maharashtra, India</b>."], [null, "<ul>\n<li> Bachelor's degree or equivalent practical experience.</li>\n<li> 2 years of experience with stakeholder management, business, sales industry or customer engagement.</li>\n</ul>"], 1], ["136350752158163654", "Web Solutions Engineer, Google Technical Services, Tools Development and Automation", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckdL3UQkt_EqpqZEqjwhrmOQWmot-ISR4yjl3e8E49rsuEjsA9yzvgno9PayVx1d1-Pw-k_FCaVDYPeTaT16UmBM9kF-1qhjAgIuuj_m3zvQM5MWb0caqrOTXwrvI1w%3D%3D_V2&loc=IN&title=Web+Solutions+Engineer", [null, "<ul>\n<li>Design, build, deploy, and improve elegant, scalable, and modern full-stack web applications using standard and Google-specific software development tools. Ensure reliable backends, build pipelines to aggregate data from multiple sources, implement responsive and UX-rich front-ends, or enhance performance of existing tools and services.</li>\n<li>Analyze problems and develop solutions, while identifying dependencies and resolving issues to drive implementation.</li>\n<li>Make technical contributions, including writing and reviewing design documents, tests, and code (e.g., JavaScript, Python, TypeScript, SQL).</li>\n<li>Provide subject-matter expertise and utilize comprehensive knowledge of Google's relevant technologies, principles, practices, and coding standards.</li>\n<li>Collaborate with cross-functional users and stakeholders to identify pain points and devise innovative technical solutions.</li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor’s degree in Science, Technology, Engineering, Mathematics, or equivalent practical experience.<br></li>\n<li>2 years of experience troubleshooting and advocating for customers' needs, and triaging technical issues (e.g., hardware, software, application, operational, process).<br></li>\n<li>Experience reading code in a general purpose coding language (e.g., Java, C, C++, Python, Shell, Go, JavaScript) or in system design.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Ability to provide effective technical solutions to business challenges.</li>\n<li>Demonstrated ability to be flexible/adaptable in exercising judgment in a dynamic environment and to prioritize and manage tasks efficiently.</li>\n<li>Demonstrated passion for engineering and experience with unit testing, agile project development, and bug and change management systems.</li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Hyderabad, Telangana, India", ["Street No. 13, Kondapur, Raja Rajeshwara Nagar, Gachibowli, Hyderabad, Telangana 500084, India"], "Hyderabad", "500084", "TS", "IN"]], [null, "<p>&lt;b&gt;&lt;/b&gt;<b></b></p>\n<p>Google creates products and services that make the world a better place, and gTech’s role is to help bring them to life. Our teams of trusted advisors support customers globally. Our solutions are rooted in our technical skill, product expertise, and a thorough understanding of our customers’ complex needs. Whether the answer is a bespoke solution to solve a unique problem, or a new tool that can scale across Google, everything we do aims to ensure our customers benefit from the full potential of Google products.<br><br>To learn more about gTech, check out our <a href=\"https://www.youtube.com/watch?v=HcjR6ZngQcw\">video</a>.</p>"], [2], [1790169088, 15000000], [1790169088, 15000000], [1790169088, 53000000], [null, ""], null, null, [null, ""], [null, "<ul>\n<li>Bachelor’s degree in Science, Technology, Engineering, Mathematics, or equivalent practical experience.<br></li>\n<li>2 years of experience troubleshooting and advocating for customers' needs, and triaging technical issues (e.g., hardware, software, application, operational, process).<br></li>\n<li>Experience reading code in a general purpose coding language (e.g., Java, C, C++, Python, Shell, Go, JavaScript) or in system design.</li>\n</ul>"], 1]], null, 24, 20], sideChannel: {}});</script></body></html>
