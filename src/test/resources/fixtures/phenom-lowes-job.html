Capability Center of Lowe’s Companies Inc., is a hub for driving our technology, business, analytics, and shared services strategy. Based in Bengaluru with over 4,500 associates, it powers innovations across omnichannel retail, AI/ML, enterprise architecture, supply chain, and customer experience. From supporting and launching homegrown solutions to fostering innovation through its Catalyze platform, Lowe’s India plays a pivotal role in transforming home improvement retail while upholding strong commitment to social impact and sustainability. For more information, visit &lt;/span&gt;&lt;a href=\"https://nam11.safelinks.protection.outlook.com/?url&#61;https%3A%2F%2Flowes.co.in%2F&amp;data&#61;05%7C02%7Criddhi.goyal%40lowes.com%7C2f8072d35f314967e03108ddacf1e5f5%7Cbcfa3e87841e48c7983b584159dd1a69%7C0%7C0%7C638856877139027596%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata&#61;Pi1F1ZIfNGNFXtkXvlBPiHI0k5%2FggslzRwunT4SsTXY%3D&amp;reserved&#61;0\" target=\"_blank\"&gt;&lt;span&gt;Lowes India&lt;/span&gt;&lt;/a&gt;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;&lt;span&gt;About the Team&lt;/span&gt;&lt;/b&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;The Electronic Data Interchange (EDI) team plays a critical role in enabling the seamless exchange of supply chain information between Lowe’s and our vendor partners.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;We manage the end-to-end EDI vendor lifecycle, from onboarding and testing through production support and issue resolution. The team works closely with vendors, Merchandising, Inventory Fulfillment, Technology, and other  partners to ensure transactions are accurate, timely, and meet Lowe’s EDI requirements.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;We also monitor key EDI platforms, identify and resolve transaction or system issues, and help maintain the quality of data flowing into downstream business systems. Through this work, the team helps enable reliable order execution, product visibility, and a better customer experience.&lt;/span&gt;&lt;br /&gt;&lt;b&gt;Job Summary:&lt;/b&gt;&lt;/p&gt;&lt;p&gt;An &lt;b&gt;Electronic Data Interchange Analyst&lt;/b&gt; is responsible for determining system outages that impact service for electronic commerce transactions. (i.e., business applications, BizLink, Nexus®).&lt;br /&gt;Once an issue has been determined, the appropriate escalation and resolution of any issues. Another responsibility is to collaborate with Merchandising and other teams to ensure vendors are set up, tested, and moved to production by the time orders are ready to be placed. Overcoming vendor delays in this process requires a great deal of finesse, encouragement &amp; cheerleading.&lt;br /&gt;Once a vendor has moved from test to production, resolving issues with EDI standards and adherence to Lowe&#39;s EDI requirements requires a coordinator to work with the vendor to resolve issues in the setup of their internal processes and in many cases requires their assistance to work with a Merchandiser or Inventory Fulfillment person to tweak the way their programs are set up to send/receive the appropriate information from the vendor.&lt;br /&gt;Ensuring the validity of the data allows the receiving business systems to accurately determine product arrival, schedule resources accordingly, or advise a customer of an upcoming delivery or delay.&lt;br /&gt;&lt;b&gt;Roles &amp; Responsibilities:&lt;/b&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Core Responsibilities:&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Establishes and maintains electronic commerce relationships with Lowe’s vendors and freight carriers; ensures compliance with Lowe’s internal standards and ANSI standards&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt; Develops and maintains electronic commerce implementation guides, procedures, and statistics&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Monitors electronic transmission of electronic commerce documents (e.g., purchase orders) to ensure timely transmission and conformance to standards&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Supervises external development of electronic commerce software for Lowe’s vendors and freight carriers to ensure compliance with Lowe’s and ANSI standards&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Performs quality control checks of electronic commerce information to ensure timely processing of documents&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Works with electronic commerce translators to establish and maintain trading partner profiles in the appropriate database&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Directs network service providers on the electronic information flow to/from Lowe’s&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Communicates product flow information to trading partners and to store and distribution center personnel&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Implements new VMI relationships with vendors to improve forecasting, service s, ROI, turnover, etc.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Conducts new Inventory Specialist training sessions on a quarterly basis.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Suggests modifications to electronic commerce software applications that serve Lowe’s best interests.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Stays current with electronic commerce industry practices and procedures; serves as a resource to provide insight into industry practices as they relate to electronic commerce initiatives&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;b&gt;Years of Experience:&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Overall, 2 - 4 years of Experience&lt;/li&gt;&lt;li&gt;2 years of experience in EDI Management &amp; Supply chain Management&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;br /&gt;&lt;b&gt;Education Qualification &amp; Certifications &lt;/b&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Required Minimum Qualifications&lt;/b&gt;:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Bachelors Degree in Engineering, Supply Chain Management, Operations Research or Related Field&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;b&gt;Skill Set Required &lt;/b&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Primary Skills (must have)&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;b&gt;EDI Platform Experience:&lt;/b&gt; Hands-on experience working with enterprise EDI/integration platforms such as &lt;b&gt;OpenText BizManager, IBM Sterling, Cleo Integration Cloud, or comparable EDI solutions&lt;/b&gt;. Experience troubleshooting EDI transactions, integrations, and processing failures is preferred.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;b&gt;EDI Standards &amp; Transactions:&lt;/b&gt; Working knowledge of &lt;b&gt;ANSI X12 and/or EDIFACT standards&lt;/b&gt;, including the ability to understand EDI transaction structures, segments, elements, and validation requirements.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;b&gt;EDI Troubleshooting:&lt;/b&gt; Ability to investigate EDI transaction failures, identify root causes, and work with vendors, business teams, and technical partners to drive issues through resolution.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;b&gt;Supply Chain Knowledge:&lt;/b&gt; Familiarity with supply chain processes, including inventory management, replenishment/planning, forecasting, order fulfillment, and transportation, with an understanding of how system/data exchanges support these processes.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;b&gt;Problem Solving:&lt;/b&gt; Strong analytical and problem-solving skills, with the ability to interpret transaction data, identify patterns and exceptions, perform root-cause analysis, and recommend solutions.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;b&gt;Communication:&lt;/b&gt; Strong written and verbal communication skills, with the ability to communicate technical issues in business terms and develop clear documentation and presentations for business partners and management.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;b&gt;Cross-Functional Collaboration:&lt;/b&gt; Ability to work effectively with &lt;b&gt;vendors, internal business teams, &lt;/b&gt;technology teams, and other supply chain partners to support EDI onboarding, production issues, and process improvements.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;br /&gt;&lt;b&gt;Secondary Skills (Desirable)&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;b&gt;Data &amp; Reporting:&lt;/b&gt; Experience using analytical and reporting tools such as &lt;b&gt;SQL, Power BI, and Excel&lt;/b&gt; for data mining, analysis, reporting, and visualization.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;br /&gt;&lt;i&gt;Lowe&#39;s is an equal opportunity employer and administers all personnel practices without regard to race, color, religious creed, sex, gender, age, ancestry, national origin, mental or physical disability or medical condition, sexual orientation, gender identity or expression, marital status, military or veteran status, genetic information, or any other category protected under federal, state, or local law.&lt;/i&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;","title":"Analyst - EDI","datePosted":"2026-09-26","@context":"http://schema.org","occupationalCategory":"Supply Chain","directApply":false}</script>
