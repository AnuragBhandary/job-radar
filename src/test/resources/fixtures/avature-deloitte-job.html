            "description": "\u003Cbr\u003E\u003Cdiv\u003E\u003Cp style=\"font-family: &quot;Times New Roman&quot;; font-size: medium;\"\u003EThe Architect will define and govern secure enterprise and cloud architecture across Deloitte\u2019s technology landscape. The Architect partners with business, solution architecture, engineering, risk, and delivery teams to translate business requirements into security architectures, patterns, and controls. The Architect will lead security design reviews, identify and communicate technology risks, document architecture decisions, and provide pragmatic guidance that enables secure delivery in line with Deloitte security policies, standards, and risk appetite.\u003C\/p\u003E\u003Cp style=\"font-family: &quot;Times New Roman&quot;; font-size: medium;\"\u003E\u003Cstrong\u003EWork you'll do\u003C\/strong\u003E\u003C\/p\u003E\u003Cp style=\"font-family: &quot;Times New Roman&quot;; font-size: medium;\"\u003EAs an Architect on the internal services team, you will be responsible for:\u003C\/p\u003E\u003Cul style=\"font-family: &quot;Times New Roman&quot;; font-size: medium;\"\u003E\u003Cli\u003EDefine security architecture vision, principles, reference architectures, and roadmaps for enterprise and cloud technology, aligned with business strategy and organizational risk appetite.\u003C\/li\u003E\u003Cli\u003EDesign and assure security architectures for on-premises, cloud, hybrid, and multi-cloud environments across infrastructure, applications, data, identity, networking, and integration services.\u003C\/li\u003E\u003Cli\u003ELead security architecture and design reviews throughout the delivery lifecycle; translate business, regulatory, privacy, resilience, and threat requirements into control objectives; and document risks, decisions, exceptions, and remediation actions.\u003C\/li\u003E\u003Cli\u003EDevelop reusable security patterns, configuration baselines, automated guardrails, and controls for infrastructure as code, policy as code, DevSecOps pipelines, and continuous compliance.\u003C\/li\u003E\u003Cli\u003EAssess emerging technologies, third-party services, and artificial intelligence (AI)-enabled solutions; provide risk-based recommendations, facilitate architecture review forums, and coach architecture and engineering teams on secure-by-design practices.\u003C\/li\u003E\u003C\/ul\u003E\u003Cp style=\"font-family: &quot;Times New Roman&quot;; font-size: medium;\"\u003E\u003Cstrong\u003EThe team\u003C\/strong\u003E\u003C\/p\u003E\u003Cp style=\"font-family: &quot;Times New Roman&quot;; font-size: medium;\"\u003EAt Deloitte, we\u2019re all about collaboration. And nowhere is this more apparent than among our 2,000-strong internal services team. With our combined specialist skills, we provide all the essential support and advice our client-facing colleagues need, right across the firm. This enables them to focus all of their efforts on delivering the best service possible to their clients. Covering seven distinct areas; Human Resources, Clients &amp; Industries, Finance &amp; Legal, Practice Support Services, Quality &amp; Risk Services, IT Services, and Workplace Services &amp; Real Estate, together we live, breathe and deliver the Deloitte experience.\u003C\/p\u003E\u003Cp style=\"font-family: &quot;Times New Roman&quot;; font-size: medium;\"\u003E\u003Cstrong\u003ELocation: Hyderabad\u003C\/strong\u003E\u003C\/p\u003E\u003Cp style=\"font-family: &quot;Times New Roman&quot;; font-size: medium;\"\u003E\u003Cstrong\u003EShift Timings: 2 PM to 11 PM\u003C\/strong\u003E\u003C\/p\u003E\u003Cp style=\"font-family: &quot;Times New Roman&quot;; font-size: medium;\"\u003E\u003Cstrong\u003EQualifications\u003C\/strong\u003E\u003C\/p\u003E\u003Cp style=\"font-family: &quot;Times New Roman&quot;; font-size: medium;\"\u003ERequired:\u003C\/p\u003E\u003Cul style=\"font-family: &quot;Times New Roman&quot;; font-size: medium;\"\u003E\u003Cli\u003E13+ years of experience in cyber security, including security architecture or security design roles.\u003C\/li\u003E\u003Cli\u003EBachelor\u2019s or Master\u2019s degree in cyber security, computer science, engineering, or information systems, or 13+ years of professional experience in cyber security.\u003C\/li\u003E\u003Cli\u003EExperience producing and governing security architectures for enterprise, cloud, hybrid, infrastructure, application, and data environments, including identity and access management, network and platform security, cryptography, data protection, application programming interface security, logging, monitoring, resilience, and secure software delivery.\u003C\/li\u003E\u003Cli\u003EExperience designing and assuring on-premises data-centre and infrastructure security and on-premises-to-cloud, network, or server migration architectures.\u003C\/li\u003E\u003Cli\u003EExperience with Amazon Web Services (AWS), Microsoft Azure, and Google Cloud Platform (GCP), including hybrid connectivity, landing zones, identity and access management, network architecture, compute and container platforms, cloud-native security services, infrastructure as code, continuous integration and continuous delivery pipelines, and workload migration.\u003C\/li\u003E\u003Cli\u003EExperience leading security design reviews, threat modelling, architecture risk assessments, risk treatment, and remediation planning.\u003C\/li\u003E\u003Cli\u003EExperience applying security architecture methods or frameworks, including Sherwood Applied Business Security Architecture (SABSA), the National Institute of Standards and Technology Cybersecurity Framework, National Institute of Standards and Technology Special Publication 800-53, or International Organization for Standardization\/International Electrotechnical Commission 27001, and designing security and governance controls for AI and generative AI solutions.\u003C\/li\u003E\u003C\/ul\u003E\u003Cp style=\"font-family: &quot;Times New Roman&quot;; font-size: medium;\"\u003EPreferred:\u003C\/p\u003E\u003Cul style=\"font-family: &quot;Times New Roman&quot;; font-size: medium;\"\u003E\u003Cli\u003EOne or more of the following certifications: Certified Information Systems Security Professional, Information Systems Security Architecture Professional, Certified Cloud Security Professional, Certified Information Security Manager, SABSA, or a cloud security architecture certification.\u003C\/li\u003E\u003Cli\u003EExperience applying the National Institute of Standards and Technology AI Risk Management Framework, International Organization for Standardization\/International Electrotechnical Commission 42001, or Open Web Application Security Project guidance for large language model and generative AI applications.\u003C\/li\u003E\u003Cli\u003EExperience working in Agile, product, development, security, and operations (DevSecOps), or traditional project delivery models.\u003C\/li\u003E\u003C\/ul\u003E\u003C\/div\u003E",
