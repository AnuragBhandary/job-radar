<html><body><script>window.__staticRouterHydrationData = JSON.parse("{\"loaderData\": {\"jobDetails\": {\"jobsData\": {\"id\": \"REQ-200686075\", \"jobNumber\": \"200686075-1052\", \"postingTitle\": \"Software Engineer - Digital Asset Management\", \"jobSummary\": \"Content Solutions Engineering, part of Apple\\u2019s IS&T organization, builds and maintains the Content Management systems \\u2014 including Digital Asset Management (DAM) \\u2014 that empower Apple\\u2019s business teams to author, manage, and publish content across a wide range of channels. We build the systems that sit behind every piece of content Apple\\u2019s customers and employees interact with, at scale and with high reliability. We\\u2019re looking for a backend engineer who is passionate about building resilient, high-throughput systems that make it effortless for content teams to manage, discover, and deliver digital assets across Apple\\u2019s ecosystem.\", \"description\": \"You will design, build, and operate backend services for our Digital Asset Management platform, working closely with content, publishing, and platform engineering teams to deliver reliable, scalable systems that power content authoring and delivery across Apple\\u2019s public and internal properties.\", \"responsibilities\": \"Design and build scalable backend services and APIs for asset ingestion, transcoding, metadata management, and taxonomy services using Java and Spring Boot.\\nBuild and operate high-throughput ingestion and transcoding pipelines that process a wide variety of digital asset types at scale.\\nDesign and implement search and retrieval APIs for digital assets, leveraging Solr/Elasticsearch for fast, relevant asset discovery.\\nDevelop and maintain rights and licensing enforcement mechanisms to ensure assets are used and distributed in compliance with content policies.\\nIntegrate DAM services with upstream and downstream content workflows, enabling seamless authoring-to-publish experiences across cha
