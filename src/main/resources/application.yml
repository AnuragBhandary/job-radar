job-radar:

  google:
    # Service-account key. Never committed; see .gitignore. The account already
    # holds Editor on the target spreadsheet.
    credentials-path: ${JOB_RADAR_GOOGLE_KEY:~/.config/job-radar/google-key.json}
    # Empty default so the app can boot for fetch/screen/digest without Sheets
    # configured. The Sheets client validates this lazily and fails loudly there.
    spreadsheet-id: ${JOB_RADAR_SHEET_ID:}
    sheet-name: Untitled

  # The daily handoff file, read in a Claude session. See CLAUDE.md.
  output-dir: ${JOB_RADAR_OUT:./inbox}

  http:
    user-agent: "job-radar/1.0 (personal job search tool)"
    delay-between-requests-ms: 500
    timeout-seconds: 20
    max-retries: 3

  # Every raw API response is written to disk exactly as received. Gives test
  # fixtures for free, and makes "why was this rejected?" answerable afterwards
  # from the bytes the decision was made on.
  fixtures:
    enabled: ${JOB_RADAR_FIXTURES:true}
    dir: ${JOB_RADAR_FIXTURE_DIR:./fixtures}

  # Postings open at least this many days are set aside from the handoff file and
  # counted. Not an eligibility decision: the row is untouched.
  digest:
    stale-days: 45
    # Employers that keep standing roles open for years; their posted dates say
    # nothing about whether the role is live. Comma-separated board tokens.
    stale-exempt-boards: canonical

  # ---------------------------------------------------------------------------
  # Country strategy.
  #
  # Where the applicant is willing to move, and how badly. Preferences, not
  # immigration facts: they are expected to change, and nothing here is a legal
  # claim about a visa. The figures that ARE claims about the world - salary
  # floors - carry the sentence they came from and a date to re-check them.
  #
  # A tier is NOT eligibility. EXCLUDED means "do not recommend moving there",
  # not "throw the posting away": the United States is excluded for relocation
  # and remote-enabled at the same time, which is the single most valuable lane
  # in the whole strategy and was previously unreachable.
  #
  # A country absent from this list is not rejected either. It resolves to tier
  # UNKNOWN, is classified and stored, and sits outside the default feed until
  # somebody decides about it.
  # ---------------------------------------------------------------------------
  strategy:
    home-country: IN

    countries:
      # --- home -------------------------------------------------------------
      - country-code: IN
        relocation-tier: PRIMARY
        salary-floor: 500000
        currency: INR
        # Living at home covers housing. Set low on purpose (2026-09-19): the first
        # payslipped year is worth more than the salary it pays, so a real
        # software role at home is taken almost regardless of pay.
        salary-floor-basis: "home metro, living at home - no rent"

      # --- primary relocation ------------------------------------------------
      - country-code: DE
        relocation-tier: PRIMARY
        salary-floor: 45934.20
        currency: EUR
        salary-floor-basis: "Blue Card shortage-occupation threshold (IT is a shortage
          occupation); no prior work experience needed"
        verify-by: 2027-01-01
      - country-code: IE
        relocation-tier: PRIMARY
        salary-floor: 40904
        currency: EUR
        salary-floor-basis: "Critical Skills Employment Permit, basic salary only;
          below EUR 48,000 Dublin rent leaves about what Mumbai 10L would"
        verify-by: 2027-01-01
      - country-code: NL
        relocation-tier: PRIMARY
        salary-floor: 52284
        currency: EUR
        salary-floor-basis: "under-30 kennismigrant rate, excl. 8% holiday allowance"
        verify-by: 2027-01-01

      # --- the Gulf ----------------------------------------------------------
      # A preference, not a claim about visas. No personal income tax, so more of
      # the pay is kept than anywhere in Europe - which is why
      # match.country-preference already ranks the Gulf just behind
      # remote-from-home. Until 2026-09-15 these codes were in the vocabulary and
      # not here, so a Doha new-grad role resolved to UNKNOWN and fell out of
      # the feed. No floor is recorded: an invented threshold would be quoted
      # back later as though it had been checked.
      # 2026-09-19 re-ranking, for settling long-term rather than for the fastest
      # savings: Ireland, Germany, Netherlands, then Australia, then Canada. The
      # Gulf is a savings stint with no route to permanent residence, so it drops
      # to SECONDARY and carries a floor below which Europe saves as much.
      - country-code: AE
        relocation-tier: SECONDARY
        salary-floor: 144000
        currency: AED
        salary-floor-basis: "AED 12,000/month; below this a Dublin or Berlin offer
          saves as much and also leads to permanent residence"
      - country-code: SA
        relocation-tier: SECONDARY
      - country-code: QA
        relocation-tier: SECONDARY

      # --- secondary ---------------------------------------------------------
      # No floor recorded for any of these. Unknown is stored as unknown: a
      # fabricated threshold would be quoted back later as though it had been
      # checked, which is the failure the verify-by dates above exist for.
      # Employer sponsorship (subclass 482) needs a year of paid experience at the
      # time of application; the Work and Holiday ballot needs none. Off the daily
      # list until mid-2027, when the one-year date is close. Raise to PRIMARY then,
      # or at once if the ballot draws.
      - country-code: AU
        relocation-tier: OPPORTUNISTIC
        salary-floor: 79499
        currency: AUD
        salary-floor-basis: "Skills in Demand Core Skills Income Threshold from 1 July 2026"
        verify-by: 2027-07-01
      # The Skilled Worker salary threshold is high for a junior role, and
      # settlement is proposed to move from 5 to 10 years.
      - country-code: GB
        relocation-tier: LOW
      - country-code: FI
        relocation-tier: SECONDARY

      # --- opportunistic -----------------------------------------------------
      - country-code: AT
        relocation-tier: OPPORTUNISTIC
      # Express Entry no longer gives points for a job offer, so a Canadian posting
      # needing relocation does not help that route. Remote roles from Canadian
      # employers still count.
      - country-code: CA
        relocation-tier: EXCLUDED
        relocation-enabled: false
        remote-enabled: true
      - country-code: NZ
        relocation-tier: OPPORTUNISTIC
      - country-code: SG
        relocation-tier: OPPORTUNISTIC
      - country-code: SE
        relocation-tier: OPPORTUNISTIC
      - country-code: FR
        relocation-tier: OPPORTUNISTIC

      # --- low ---------------------------------------------------------------
      - country-code: CH
        relocation-tier: LOW

      # --- excluded for relocation, and only for relocation ------------------
      # remote-enabled stays true, and that is the point of the row. A US company
      # hiring from Mumbai is international remote: no visa, no rent, no move, and
      # nothing the relocation strategy has an opinion about.
      - country-code: US
        relocation-tier: EXCLUDED
        relocation-enabled: false
        remote-enabled: true

  # ---------------------------------------------------------------------------
  # Country vocabulary.
  #
  # This is screening.geo.excluded-locations, turned inside out. The same
  # hundred and fifty place names that used to mean only "reject this" now say
  # which country a posting is in; whether that country is worth pursuing is the
  # strategy block above, and the two are no longer the same decision.
  #
  # The four original target countries are NOT repeated here. LocationClassifier
  # reads them from screening.geo.*-cities, so there is one list per country and
  # the classifier cannot disagree with GeoFilter about where Munich is.
  #
  # Matched as whole words: "us" must not fire inside "Columbus", and "uk" must
  # not fire inside "Ukraine".
  # ---------------------------------------------------------------------------
  geo:
    countries:
      US: [united states, usa, "u.s.", us, new york, san francisco, seattle,
           austin, boston, chicago, denver, atlanta, los angeles, miami,
           palo alto, mountain view, san jose, san diego, portland, pittsburgh,
           ohio, california, texas, washington, massachusetts, new jersey,
           illinois, florida, colorado, north carolina, virginia, pennsylvania,
           arizona, oregon, utah, minnesota, michigan, tennessee, maryland,
           connecticut, wisconsin, new hampshire]
      CA: [canada, toronto, vancouver, montreal, ottawa, calgary, waterloo]
      GB: [united kingdom, uk, england, scotland, wales, london, manchester,
           edinburgh, cambridge, bristol, glasgow, leeds, belfast]
      AU: [australia, sydney, melbourne, brisbane, perth, canberra]
      NZ: [new zealand, auckland, wellington, christchurch]
      SG: [singapore]
      FR: [france, paris, lyon, toulouse, bordeaux, lille, nantes]
      SE: [sweden, stockholm, gothenburg, malmo, "malmö", lund]
      FI: [finland, helsinki, espoo, tampere, oulu]
      AT: [austria, vienna, wien, graz, linz]
      CH: [switzerland, zurich, "zürich", geneva, lausanne, basel, bern, zug]
      DK: [denmark, copenhagen, aarhus]
      NO: [norway, oslo, bergen, trondheim]
      BE: [belgium, brussels, antwerp, ghent, leuven]
      ES: [spain, madrid, barcelona, valencia, seville, malaga, bilbao]
      PT: [portugal, lisbon, lisboa, porto, braga]
      IT: [italy, milan, milano, rome, roma, turin, bologna]
      PL: [poland, warsaw, warszawa, krakow, "kraków", wroclaw, gdansk, poznan]
      CZ: [czech, czechia, prague, praha, brno]
      HU: [hungary, budapest, debrecen]
      RO: [romania, bucharest, cluj, timisoara, iasi]
      BG: [bulgaria, sofia, plovdiv, varna]
      HR: [croatia, zagreb, split, rijeka]
      RS: [serbia, belgrade, novi sad]
      UA: [ukraine, kyiv, kiev, lviv, kharkiv]
      GR: [greece, athens, thessaloniki]
      TR: [turkey, "türkiye", istanbul, ankara, izmir]
      IL: [israel, tel aviv, jerusalem, haifa]
      AE: [uae, united arab emirates, dubai, abu dhabi]
      SA: [saudi, saudi arabia, riyadh, jeddah]
      QA: [qatar, doha]
      EG: [egypt, cairo, alexandria]
      NG: [nigeria, lagos, abuja]
      KE: [kenya, nairobi, mombasa]
      GH: [ghana, accra]
      ZA: [south africa, cape town, johannesburg, pretoria, durban]
      JP: [japan, tokyo, osaka, kyoto, yokohama]
      KR: [korea, south korea, seoul, busan]
      CN: [china, shanghai, beijing, shenzhen, guangzhou, hangzhou]
      TW: [taiwan, taipei, hsinchu]
      PH: [philippines, manila, cebu, makati]
      ID: [indonesia, jakarta, bandung, surabaya]
      VN: [vietnam, ho chi minh, hanoi, da nang]
      MY: [malaysia, kuala lumpur, penang, johor]
      TH: [thailand, bangkok, chiang mai, phuket]
      MX: [mexico, mexico city, guadalajara, monterrey]
      BR: [brazil, brasil, sao paulo, "são paulo", rio de janeiro, belo horizonte]
      AR: [argentina, buenos aires, cordoba, rosario]
      CO: [colombia, bogota, "bogotá", medellin, "medellín", cali]
      CL: [chile, santiago, valparaiso]
      PE: [peru, lima, arequipa]
      UY: [uruguay, montevideo]
      CR: [costa rica, san jose costa rica, heredia]

    # Hiring regions. Not countries, and they must not be stored as one. The only
    # question asked of a region is whether India is inside it, because that is
    # what separates "Remote, APAC" from "Remote, EMEA" - one is reachable from
    # Mumbai and the other is not, and the old filter rejected both.
    #
    # Order matters: the first marker to match wins, so the specific regions come
    # before "europe", which appears inside several of their descriptions.
    regions:
      - name: EMEA
        markers: [emea]
        includes-india: false
      - name: LATAM
        markers: [latam, latin america]
        includes-india: false
      - name: ANZ
        markers: [anz, australia and new zealand]
        includes-india: false
      - name: APAC
        markers: [apac, asia pacific, asia-pacific, asia]
        includes-india: true
      - name: AMERICAS
        markers: [americas, north america, south america]
        includes-india: false
      - name: NORDICS
        markers: [nordics, nordic, scandinavia]
        includes-india: false
      - name: MENA
        markers: [mena, middle east]
        includes-india: false
      - name: EUROPE
        markers: [europe, european union, eea, eu]
        includes-india: false

    # "Remote from anywhere". Matched against the LOCATION only, never the title:
    # "Global Platform" in a job title names a team, and matching it there would
    # turn every such role into a worldwide hire.
    global-markers:
      [worldwide, world wide, globally, global, anywhere, work from anywhere,
       fully distributed, any location]

    # Where a false friend actually is. screening.geo.false-friends catches these
    # before the target lists claim them; this says what to file them under
    # instead of the old answer, which was nothing at all.
    #
    # Bracket notation, and it is load-bearing. Spring's relaxed binding
    # canonicalises map keys, so a key containing a space arrives mangled or not
    # at all - the map binds, it is simply empty of the entries that matter. The
    # same trap is documented on ApplicantProfile.extraAnswers, where it silently
    # emptied the escape hatch it was written for.
    false-friend-countries:
      "[dublin ohio]": US
      "[dublin oh]": US
      "[dublin california]": US
      "[dublin ca]": US
      "[dublin georgia]": US
      "[berlin connecticut]": US
      "[berlin ct]": US
      "[berlin new hampshire]": US
      "[berlin maryland]": US
      "[berlin wisconsin]": US
      "[hamburg new york]": US
      "[hamburg pennsylvania]": US
      "[hamburg new jersey]": US

  # ---------------------------------------------------------------------------
  # Screening rules. In YAML rather than Java because they change often: the
  # exclusion list grows every time a board invents a new senior-sounding title.
  # Matching is case-insensitive substring matching on the lowercased field.
  # ---------------------------------------------------------------------------
  screening:
    geo:
      mumbai-cities: [mumbai, navi mumbai, thane]
      india-cities:
        [mumbai, navi mumbai, thane, bangalore, bengaluru, hyderabad, pune,
         gurgaon, gurugram, noida, chennai, delhi, india]
      germany-cities:
        [berlin, munich, münchen, muenchen, dresden, hamburg, frankfurt,
         cologne, köln, koeln, germany, deutschland]
      ireland-cities: [dublin, cork, galway, ireland]
      netherlands-cities:
        [amsterdam, utrecht, rotterdam, eindhoven, the hague, den haag,
         netherlands, nederland, holland]
      # "distributed" was here and had to be removed: it matched "Distributed
      # Systems" in a job title, which made a Malmö role read as globally remote.
      # A remote marker has to be a word about working arrangements, not one that
      # also happens to be core software vocabulary.
      # "Home based" is Canonical's word for remote ("Home based - Worldwide").
      # Without it 47 eligible roles read as onsite with no country and never
      # reached a handoff file (found 2026-09-19).
      remote-markers: [remote, work from home, work from anywhere, distributed team,
                       home based, home-based]

      # LEGACY as of the country/work-mode phase, and still live. GeoFilter reads
      # this list and behaves exactly as it always has; screening no longer calls
      # it. The same place names now appear in job-radar.geo.countries mapped to
      # ISO codes, where they classify a posting instead of discarding it. Kept
      # rather than deleted because GeoFilter's tests are the record of a dozen
      # real misses, and because isMumbai() is still read by the salary floors.
      #
      # The expensive trap, and the reason this list is long. A posting reading
      # "Remote (Argentina)" is remote WITHIN Argentina - the country is a hiring
      # restriction, not a perk - and "Remote, London" is no more reachable from
      # Mumbai than "London" is. Any of these appearing without one of the target
      # locations above disqualifies the posting. Several applications were made
      # to country-locked remote roles by mistake before this tool existed.
      # Matched on word boundaries, so "us" does not fire inside "Columbus".
      excluded-locations:
        [argentina, mexico, brazil, brasil, colombia, chile, peru, uruguay,
         costa rica, canada, united states, usa, u.s., us, philippines,
         indonesia, vietnam, malaysia, thailand, nigeria, kenya, egypt, ghana,
         south africa, poland, portugal, spain, romania, ukraine, serbia,
         bulgaria, croatia, turkey, greece, israel, japan, korea, china,
         taiwan, singapore, australia, new zealand, united kingdom, uk,
         france, italy, sweden, denmark, norway, finland, switzerland,
         austria, belgium, czech, hungary, uae, dubai, saudi, qatar,
         emea, latam, apac, americas, anz,
         london, paris, madrid, barcelona, milan, rome, zurich, geneva,
         stockholm, copenhagen, oslo, helsinki, warsaw, prague, budapest,
         bucharest, sofia, lisbon, vienna, brussels, zagreb, tel aviv,
         toronto, vancouver, montreal, new york, san francisco, seattle,
         austin, boston, chicago, denver, atlanta, los angeles, miami,
         mexico city, sao paulo, bogota, buenos aires, lima, santiago,
         sydney, melbourne, auckland, tokyo, seoul, shanghai, beijing,
         manila, jakarta, ho chi minh, kuala lumpur, bangkok, cairo, lagos,
         nairobi, cape town, johannesburg]

      # Place names that read as a target city and are not. Checked before the
      # target lists rather than alongside the exclusions, because "dublin" on
      # its own matches Ireland and returns immediately - which is why the old
      # "dublin ohio" entry in excluded-locations never fired once.
      # Matched on adjacency after punctuation is flattened, so "Dublin, Ohio" is
      # caught while "Dublin, Ireland; Columbus, Ohio" is not.
      false-friends:
        ["dublin ohio", "dublin oh", "dublin california", "dublin ca",
         "dublin georgia", "berlin connecticut", "berlin ct",
         "berlin new hampshire", "berlin maryland", "berlin wisconsin",
         "hamburg new york", "hamburg pennsylvania", "hamburg new jersey"]

    title-include:
      [software, backend, back-end, back end, full-stack, fullstack, full stack,
       developer, engineer, data scientist, machine learning, platform, sde,
       python, java, distributed systems, ai engineer, genai, data engineer]

    # "ii" and "iii" are matched as whole words elsewhere; listing them here
    # would also reject "Engineer II" spelled inside another word.
    # Grown from the first screening run over the real corpus, where the bare
    # token "engineer" pulled in three distinct kinds of non-match:
    #   - hardware and defence engineering (Helsing alone contributed 31 of the
    #     first 80 candidates: avionics, RF, EMC, stress, camera, electronics).
    #     A different discipline, not a near miss.
    #   - customer-facing "engineer" titles: solution, presales, escalations,
    #     technical services, onboarding.
    #   - Celonis's Associate ladder, which is Value Engineer, not software.
    # And one genuinely funny one: HelloFresh's "Junior Recipe Developer".
    title-exclude:
      [senior, staff, principal, lead, manager, director, sales, account,
       marketing, recruiter, vp, head of, solution consultant, support, field,
       customer success, intern, working student, werkstudent, praktikum,
       mid-level, midlevel, intermediate, architect, sr., sr ,
       value engineer, solution engineer, solutions engineer, presales,
       pre-sales, escalations, technical services, onboarding engineer,
       recipe,
       hardware, firmware, embedded, avionics, electronics, electrical,
       mechanical, radio, wireless, optical, thermal, hydraulic, structural,
       stress, camera, emc, emi, electromagnetic, rf,
       # Found by the first Workday run. NXP is a semiconductor company and
       # Philips a medical-device one, so their "engineer" titles are chip design
       # and physics, not software - the same class of miss as Helsing's avionics.
       asic, fpga, rtl, silicon, analog, semiconductor, wafer,
       verification engineer, physical design, design engineer, dsp, physics,
       # "Remote Service Engineer - CT" is a field engineer who drives to
       # hospitals to fix scanners. It arrived classified as globally remote,
       # because "remote" in the title reads as a working arrangement and here it
       # is the first word of a job title. Same shape as the "distributed" bug.
       service engineer,
       forward deployed,
       # Software and data science only. Security engineering is a different
       # discipline with its own ladder, and it was taking the top three slots of
       # the ranked feed because a security posting names two or three
       # technologies and scores full marks on a thin list. "soc" and the rest are
       # matched as whole words, so "As-soc-iate Software Engineer" is untouched.
       security, itsec, infosec, cyber, cybersecurity, appsec, soc, penetration,
       network engineer, system engineer, systems engineer,
       automotive, mechatronics, vlsi, pcb,
       # Found by the first multi-ATS run: "Legal Counsel, EU Employment Law
       # (Platform Workers)" matched on the include token "platform".
       legal, counsel, attorney, paralegal, compliance officer,
       developer relations, developer advocate, devrel,
       logistiek, logistics, warehouse,
       # "developer" is an include token, so Catawiki's "Junior Business
       # Developer" arrived as a software candidate. It is sales.
       business developer, business development, account executive,
       sales assist, growth manager,
       # Found in the 2026-09-15 digest. Exclusions match whole words, so
       # "praktikum" never fired inside "Pflichtpraktikum" and "intern" never
       # fired inside "Internship": student-only programmes need their own tokens.
       internship, pflichtpraktikum, praktikant, premaster, abschlussarbeit,
       masterarbeit, bachelorarbeit, thesis,
       # Plant and manufacturing roles that arrive on the "engineer" include token
       # from industrial boards (Bosch, Philips). A different discipline.
       lab engineer, process engineer, maintenance engineer, stability test,
       plc, industry automation, complaint management, werkvoorbereider,
       detail engineer, project engineer,
       # Variants of rules already above, found the same day: "mid level" with a
       # space, "leader" as a seniority word, and a network-infrastructure role
       # that "network engineer" missed by one word.
       mid level, leader, network development engineer,
       # Outside the stack (2026-09-19). Not judgement about fit, which is read
       # per posting now: each of these is a platform with its own skill set that
       # the resume does not have, so the role cannot be applied to honestly.
       ios, android, flutter, react native, kotlin multiplatform,
       salesforce, sap, abap, servicenow, dynamics 365, power platform, uipath, rpa,
       citizen developer, mainframe, cobol,
       bsw, autosar, mbd, model-based design, simulink, mes,
       .net, c#, unity developer, game developer]

    # Whole boards whose roles are structurally unavailable, kept fetched rather
    # than deactivated: the postings still count towards board health, the
    # rejection is visible in the digest, and re-including a company is a config
    # edit rather than a re-seed.
    excluded-boards:
      helsing: "defence sector - roles require EU citizenship or security clearance"
      # Published bands run EUR 3,700-6,500/month against a EUR 4,357 kennismigrant
      # floor. The top of that band clears comfortably; the bottom does not, and a
      # new graduate is offered the bottom - so an offer may not support the permit
      # at all. Many of its ads are also Dutch-language only.
      Coolblue: "salary band starts below the kennismigrant floor; a junior offer may not support the permit"

    # Boost, never a requirement. Historically the only reliable source of
    # eligible roles, but requiring them would discard everything else.
    graduate-signals:
      ["graduated within the last 24 months", "new grad", "new graduate",
       "graduate programme", "graduate program", "early career", "campus",
       "entry level", "entry-level", "recent graduate", "university graduate"]

    # Reject at 2+. One year of internship reads onto "1-3 years" but not onto
    # "2+ years of professional experience".
    max-min-years: 1

  # ---------------------------------------------------------------------------
  # Salary floors. See AppProperties.SalaryFloors for why these numbers are
  # shaped the way they are - they look wrong without the reasoning.
  # The three European figures are legal visa thresholds and are re-indexed
  # annually, on 1 January. Re-verify at source on or after verify-by - which is
  # deliberately just before that reset, not after it: the previous 2027-03-01
  # would have run two months of digests on stale thresholds without saying so.
  # ---------------------------------------------------------------------------
  salary-floors:
    mumbai-inr: 500000
    india-other-inr: 800000
    germany-eur: 45934.20
    ireland-eur: 40904
    netherlands-eur: 52284
    dublin-comfort-eur: 48000
    verify-by: 2027-01-01

spring:
  application:
    name: job-radar
  config:
    # Personal data - name, address, EEO answers, salary bands, resume bullets -
    # is imported from outside the repository, because this repository is public
    # and that file is not the kind of thing to put in it. `optional:` so every
    # command but `resume` still boots without it.
    import:
      - optional:file:${JOB_RADAR_PROFILE:${user.home}/.config/job-radar/applicant.yml}
      # Credentials, kept apart from the profile: that file is personal data you
      # might one day show someone, this one is keys you never would. Imported
      # second so it wins.
      - optional:file:${JOB_RADAR_SECRETS:${user.home}/.config/job-radar/secrets.yml}
  main:
    banner-mode: off
  datasource:
    url: ${JOB_RADAR_DB:jdbc:sqlite:./job-radar.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: com.anuragbhandary.jobradar.config.SqliteDialect
        hbm2ddl:
          # Fail loudly on a DDL statement the database rejects. Hibernate's
          # default is to log and continue, which has now hidden two real schema
          # bugs in this project: a dropped unique constraint, and an ADD COLUMN
          # that SQLite refused. Both surfaced much later as something else.
          halt_on_error: true
    open-in-view: false

logging:
  level:
    com.anuragbhandary.jobradar: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %msg%n"
