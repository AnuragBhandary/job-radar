job-radar:
  google:
    # Service-account key. Never committed; see .gitignore. The account already
    # holds Editor on the target spreadsheet.
    credentials-path: ${JOB_RADAR_GOOGLE_KEY:~/.config/job-radar/google-key.json}
    # Empty default so the app can boot for fetch/screen/digest without Sheets
    # configured. The Sheets client validates this lazily and fails loudly there.
    spreadsheet-id: ${JOB_RADAR_SHEET_ID:}
    sheet-name: Untitled

  output-dir: ${JOB_RADAR_OUT:./digests}

  http:
    user-agent: "job-radar/1.0 (personal job search tool)"
    delay-between-requests-ms: 500
    timeout-seconds: 20
    max-retries: 3

  # Every raw API response is written to disk exactly as received. Gives test
  # fixtures for free, and makes "why was this rejected?" answerable afterwards
  # from the bytes the decision was made on.
  fixtures:
    enabled: ${JOB_RADAR_FIXTURES:true}
    dir: ${JOB_RADAR_FIXTURE_DIR:./fixtures}

  # ---------------------------------------------------------------------------
  # Screening rules. In YAML rather than Java because they change often: the
  # exclusion list grows every time a board invents a new senior-sounding title.
  # Matching is case-insensitive substring matching on the lowercased field.
  # ---------------------------------------------------------------------------
  screening:
    geo:
      mumbai-cities: [mumbai, navi mumbai, thane]
      india-cities:
        [mumbai, navi mumbai, thane, bangalore, bengaluru, hyderabad, pune,
         gurgaon, gurugram, noida, chennai, delhi, india]
      germany-cities:
        [berlin, munich, münchen, muenchen, dresden, hamburg, frankfurt,
         cologne, köln, koeln, germany, deutschland]
      ireland-cities: [dublin, cork, galway, ireland]
      netherlands-cities:
        [amsterdam, utrecht, rotterdam, eindhoven, the hague, den haag,
         netherlands, nederland, holland]
      # "distributed" was here and had to be removed: it matched "Distributed
      # Systems" in a job title, which made a Malmö role read as globally remote.
      # A remote marker has to be a word about working arrangements, not one that
      # also happens to be core software vocabulary.
      remote-markers: [remote, work from home, work from anywhere, distributed team]

      # The expensive trap, and the reason this list is long. A posting reading
      # "Remote (Argentina)" is remote WITHIN Argentina - the country is a hiring
      # restriction, not a perk - and "Remote, London" is no more reachable from
      # Mumbai than "London" is. Any of these appearing without one of the target
      # locations above disqualifies the posting. Several applications were made
      # to country-locked remote roles by mistake before this tool existed.
      # Matched on word boundaries, so "us" does not fire inside "Columbus".
      excluded-locations:
        [argentina, mexico, brazil, brasil, colombia, chile, peru, uruguay,
         costa rica, canada, united states, usa, u.s., us, philippines,
         indonesia, vietnam, malaysia, thailand, nigeria, kenya, egypt, ghana,
         south africa, poland, portugal, spain, romania, ukraine, serbia,
         bulgaria, croatia, turkey, greece, israel, japan, korea, china,
         taiwan, singapore, australia, new zealand, united kingdom, uk,
         france, italy, sweden, denmark, norway, finland, switzerland,
         austria, belgium, czech, hungary, uae, dubai, saudi, qatar,
         emea, latam, apac, americas, anz,
         london, paris, madrid, barcelona, milan, rome, zurich, geneva,
         stockholm, copenhagen, oslo, helsinki, warsaw, prague, budapest,
         bucharest, sofia, lisbon, vienna, brussels, zagreb, tel aviv,
         toronto, vancouver, montreal, new york, san francisco, seattle,
         austin, boston, chicago, denver, atlanta, los angeles, miami,
         mexico city, sao paulo, bogota, buenos aires, lima, santiago,
         sydney, melbourne, auckland, tokyo, seoul, shanghai, beijing,
         manila, jakarta, ho chi minh, kuala lumpur, bangkok, cairo, lagos,
         nairobi, cape town, johannesburg, dublin ohio]

    title-include:
      [software, backend, back-end, back end, full-stack, fullstack, full stack,
       developer, engineer, data scientist, machine learning, platform, sde,
       python, java, distributed systems, ai engineer, genai, data engineer]

    # "ii" and "iii" are matched as whole words elsewhere; listing them here
    # would also reject "Engineer II" spelled inside another word.
    # Grown from the first screening run over the real corpus, where the bare
    # token "engineer" pulled in three distinct kinds of non-match:
    #   - hardware and defence engineering (Helsing alone contributed 31 of the
    #     first 80 candidates: avionics, RF, EMC, stress, camera, electronics).
    #     A different discipline, not a near miss.
    #   - customer-facing "engineer" titles: solution, presales, escalations,
    #     technical services, onboarding.
    #   - Celonis's Associate ladder, which is Value Engineer, not software.
    # And one genuinely funny one: HelloFresh's "Junior Recipe Developer".
    title-exclude:
      [senior, staff, principal, lead, manager, director, sales, account,
       marketing, recruiter, vp, head of, solution consultant, support, field,
       customer success, intern, working student, werkstudent, praktikum,
       mid-level, midlevel, intermediate, architect, sr., sr ,
       value engineer, solution engineer, solutions engineer, presales,
       pre-sales, escalations, technical services, onboarding engineer,
       recipe,
       hardware, firmware, embedded, avionics, electronics, electrical,
       mechanical, radio, wireless, optical, thermal, hydraulic, structural,
       stress, camera, emc, emi, electromagnetic, rf,
       forward deployed,
       # Found by the first multi-ATS run: "Legal Counsel, EU Employment Law
       # (Platform Workers)" matched on the include token "platform".
       legal, counsel, attorney, paralegal, compliance officer,
       developer relations, developer advocate, devrel,
       logistiek, logistics, warehouse]

    # Whole boards whose roles are structurally unavailable, kept fetched rather
    # than deactivated: the postings still count towards board health, the
    # rejection is visible in the digest, and re-including a company is a config
    # edit rather than a re-seed.
    excluded-boards:
      helsing: "defence sector - roles require EU citizenship or security clearance"
      # Published bands run EUR 3,700-6,500/month against a EUR 4,357 kennismigrant
      # floor. The top of that band clears comfortably; the bottom does not, and a
      # new graduate is offered the bottom - so an offer may not support the permit
      # at all. Many of its ads are also Dutch-language only.
      Coolblue: "salary band starts below the kennismigrant floor; a junior offer may not support the permit"

    # Boost, never a requirement. Historically the only reliable source of
    # eligible roles, but requiring them would discard everything else.
    graduate-signals:
      ["graduated within the last 24 months", "new grad", "new graduate",
       "graduate programme", "graduate program", "early career", "campus",
       "entry level", "entry-level", "recent graduate", "university graduate"]

    # Reject at 2+. One year of internship reads onto "1-3 years" but not onto
    # "2+ years of professional experience".
    max-min-years: 1

  # ---------------------------------------------------------------------------
  # Salary floors. See AppProperties.SalaryFloors for why these numbers are
  # shaped the way they are - they look wrong without the reasoning.
  # The three European figures are legal visa thresholds and are re-indexed
  # annually. Re-verify at source on or after verify-by.
  # ---------------------------------------------------------------------------
  salary-floors:
    mumbai-inr: 700000
    india-other-inr: 1400000
    germany-eur: 45934.20
    ireland-eur: 40904
    netherlands-eur: 52284
    dublin-comfort-eur: 48000
    verify-by: 2027-03-01

spring:
  application:
    name: job-radar
  main:
    banner-mode: off
  datasource:
    url: ${JOB_RADAR_DB:jdbc:sqlite:./job-radar.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: com.anuragbhandary.jobradar.config.SqliteDialect
        hbm2ddl:
          # Fail loudly on a DDL statement the database rejects. Hibernate's
          # default is to log and continue, which has now hidden two real schema
          # bugs in this project: a dropped unique constraint, and an ADD COLUMN
          # that SQLite refused. Both surfaced much later as something else.
          halt_on_error: true
    open-in-view: false

logging:
  level:
    com.anuragbhandary.jobradar: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %msg%n"
